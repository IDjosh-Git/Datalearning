<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">Relative and absolute cell references</title><desc id="desc">Copying a formula moves B2 and C2, while $F$1 stays fixed.</desc>
<rect width="720" height="100%" fill="#F7F3EA"/>
<text x="36" y="46" font-size="24" font-weight="700" fill="#023048" font-family="Arial,sans-serif">Formula copied down</text>
<path d="M 176 200 L 176 258" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="176" cy="258" r="5" fill="#C58A69"/>
<path d="M 492 200 L 176 258" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="176" cy="258" r="5" fill="#C58A69"/>
<path d="M 308 315 L 348 315" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="348" cy="315" r="5" fill="#C58A69"/>
<rect x="44" y="110" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="176" y="155.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#023048">B2 × C2</text>
<rect x="360" y="110" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="492" y="155.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#023048">Tax rate $F$1</text>
<rect x="44" y="270" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="176" y="315.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#023048">Copy formula ↓</text>
<rect x="360" y="270" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="492" y="315.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#023048">B3 × C3; $F$1</text>
</svg>