<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">How a PivotTable summarises data</title><desc id="desc">Raw transaction rows are grouped into categories and aggregated into a compact report.</desc>
<rect width="720" height="100%" fill="#F8FAFC"/>
<text x="36" y="46" font-size="24" font-weight="700" fill="#183047" font-family="Arial,sans-serif">PivotTable flow</text>
<path d="M 308 155 L 348 155" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="348" cy="155" r="5" fill="#C58A69"/>
<path d="M 176 200 L 176 258" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="176" cy="258" r="5" fill="#C58A69"/>
<path d="M 492 200 L 492 258" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="492" cy="258" r="5" fill="#C58A69"/>
<path d="M 308 315 L 348 315" stroke="#C58A69" stroke-width="3" fill="none"/>
<circle cx="348" cy="315" r="5" fill="#C58A69"/>
<rect x="44" y="110" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="176" y="155.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#183047">Raw sales rows</text>
<rect x="360" y="110" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="492" y="155.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#183047">Rows: Region</text>
<rect x="44" y="270" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="176" y="315.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#183047">Values: SUM(Sales)</text>
<rect x="360" y="270" width="264" height="90" rx="13" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="2"/>
<text x="492" y="315.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="Arial,sans-serif" font-weight="600" fill="#183047">Summary table</text>
</svg>