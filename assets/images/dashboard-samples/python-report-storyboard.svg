<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
 <title id="t">Python analytical dashboard: report presentation storyboard sample</title><desc id="d">An executive report outline showing question, verified evidence, interpretation and next action.</desc>
 <style>.h{font:700 26px Arial,sans-serif;fill:#F3F8FC}.k{font:700 14px Arial,sans-serif;fill:#A8CBE8}.p{font:16px Arial,sans-serif;fill:#D6E8F5}.s{font:13px Arial,sans-serif;fill:#9BA8AB}</style>
 <rect width="1200" height="650" rx="24" fill="#11212D"/><rect x="0" width="1200" height="10" rx="5" fill="#397BAE"/>
 <text x="48" y="62" class="h">Executive insight presentation</text><text x="48" y="91" class="s">SYNTHETIC STORYBOARD · LAYOUT REFERENCE ONLY</text>
 <rect x="45" y="135" width="530" height="210" rx="16" fill="#253745" stroke="#235A83"/><text x="68" y="174" class="k">01 · DECISION QUESTION</text><text x="68" y="214" class="h">What changed and why?</text><text x="68" y="259" class="p">State the metric, period, comparison</text><text x="68" y="290" class="p">and audience before displaying charts.</text>
 <rect x="599" y="135" width="558" height="210" rx="16" fill="#253745" stroke="#235A83"/><text x="622" y="174" class="k">02 · EVIDENCE</text><rect x="627" y="216" width="39" height="87" rx="5" fill="#397BAE"/><rect x="680" y="199" width="39" height="104" rx="5" fill="#397BAE" opacity=".9"/><rect x="733" y="232" width="39" height="71" rx="5" fill="#397BAE" opacity=".75"/><text x="805" y="248" class="p">Verified KPI + chart</text><text x="805" y="280" class="s">Units · dates · definitions</text>
 <rect x="45" y="365" width="530" height="210" rx="16" fill="#253745" stroke="#235A83"/><text x="68" y="404" class="k">03 · INTERPRETATION</text><text x="68" y="447" class="p">Observation: what the result shows</text><text x="68" y="483" class="p">Caveat: what remains uncertain</text><text x="68" y="519" class="p">Alternative explanation to investigate</text>
 <rect x="599" y="365" width="558" height="210" rx="16" fill="#253745" stroke="#235A83"/><text x="622" y="404" class="k">04 · RECOMMENDATION</text><text x="622" y="447" class="p">Action · owner · success metric</text><text x="622" y="483" class="p">Next review date and expected evidence</text><text x="622" y="519" class="p">Documented dataset and refresh version</text>
 <text x="46" y="620" class="s">Use this visual order when presenting a dashboard or data report to management.</text>
 </svg>