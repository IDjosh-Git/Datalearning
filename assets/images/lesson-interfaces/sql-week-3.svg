 font-weight="500">GROUP BY region</text><text x="251" y="432" fill="#2b7257" font-family="Arial, sans-serif" font-size="18" font-weight="500">ORDER BY revenue DESC;</text><rect x="68" y="490" width="735" height="32" rx="13" fill="#edf6f5" stroke="#d8e6ea" /><text x="84" y="512" fill="#236f5e" font-family="Arial, sans-serif" font-size="15" font-weight="600">✓ Output validated    •    Check columns, values and row counts</text>
