<html class="light" data-theme="light" lang="en">
<head><link crossorigin="anonymous" href="https://cdn.jsdelivr.net" rel="preconnect"/>
<script>document.documentElement.classList.add('dalp-auth-checking')</script>
<link href="assets/styles/access-guard.css" rel="stylesheet"/>
<script defer="" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<script defer="" src="assets/scripts/supabase-config.js"></script>
<script defer="" src="assets/scripts/supabase-client.js"></script><script defer="" src="assets/scripts/server-session.js"></script>
<script defer="" src="assets/scripts/auth-gate.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Account Connection Check | Data Analysis Learning Path</title>
<link href="assets/icons/favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="assets/icons/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="assets/icons/favicon-180.png" rel="apple-touch-icon" sizes="180x180"/>
<link href="assets/styles/connection-test-layout.css" rel="stylesheet"/>
<link href="assets/styles/design-system.css" rel="stylesheet"/>
<link href="assets/styles/private-workspace.css" rel="stylesheet"/><link href="assets/styles/modern-workspace-20261104.css" rel="stylesheet"/></head>
<body class="dalp-utility-page" data-admin-console="connection" data-private-workspace="true" data-responsive-page="connection-test">
<main id="main-content"><div class="card">
<h1>Check your account connection</h1>
<p>We’re checking that your account can connect securely.</p>
<div id="status">Testing connection…</div>
<p><a href="index.html">Back to Learning Portal</a></p>
</div>
</main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 const el=document.getElementById('status');
 try{
   if(!window.ZAH_DB.configured) throw new Error('Your account connection is unavailable.');
   const {data,error}=await window.ZAH_DB.client.auth.getSession();
   if(error) throw error;
   el.className='ok';
   el.textContent='Your account connection is working. You can continue learning.';
 }catch(e){
   el.className='bad';
   el.textContent='We couldn’t connect to your account right now. Please refresh and try again.';
 }
},{once:true});
</script>
<script defer="" src="assets/scripts/course-studio-data.js"></script>
<script defer="" src="assets/scripts/accessibility.js"></script>
<script defer="" src="assets/scripts/private-navigation.js"></script></body>
</html>
