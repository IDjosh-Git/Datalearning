<div class="auth-brand-shell"><svg class="auth-brand-logo" role="img" aria-label="Data Analysis Learning Path logo" width="32" height="32"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Data Analysis Learning Path logo"><defs><linearGradient id="da" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#E6B779"/><stop offset="1" stop-color="#A4DFBD"/></linearGradient></defs><rect width="72" height="72" rx="20" fill="#176B53"/><rect x="14" y="43" width="9" height="15" rx="3" fill="#E6B779"/><rect x="27" y="35" width="9" height="23" rx="3" fill="#D8EDE1"/><rect x="40" y="25" width="9" height="33" rx="3" fill="#A4DFBD"/><path d="M14 31 26 20l11 8 19-15" fill="none" stroke="url(#da)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="m49 13 7 0 0 7" fill="none" stroke="#A4DFBD" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="brand-company-name"><strong>Data Analysis Learning Path</strong><span>Connection Test</span></div></div><h1>Check your account connection</h1>
<p>We’re checking that your account can connect securely.</p>
<div id="status">Testing connection…</div>
<p><a href="index.html">Back to Learning Portal</a></p>
</div>
</main>
<script>
(async()=>{
 const el=document.getElementById('status');
 try{
   if(!window.ZAH_DB.configured) throw new Error('Your account connection is unavailable.');
   const {data,error}=await window.ZAH_DB.client.auth.getSession();
   if(error) throw error;
   el.className='ok';
   el.textContent='Your account connection is working. You can continue learning.';
 }catch(e){
   el.className='bad';
   el.textContent='We couldn’t connect to your account right now. Please refresh and try again.';
 }
})();
</script>
