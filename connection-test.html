<body data-responsive-page="connection-test"><a class="dalp-skip-link" href="#main-content">Skip to main content</a>
<main id="main-content"><div class="card">
<div class="auth-brand-shell"><img class="dalp-inline-logo" src="assets/icons/da-logo.svg" width="32" height="32" alt="Data Analysis Learning Path logo"/><div class="brand-company-name"><strong>Data Analysis Learning Path</strong><span>Connection Test</span></div></div><h1>Check your account connection</h1>
<p>We’re checking that your account can connect securely.</p>
<div id="status">Testing connection…</div>
<p><a href="index.html">Back to Learning Portal</a></p>
</div>
</main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 const el=document.getElementById('status');
 try{
   if(!window.ZAH_DB.configured) throw new Error('Your account connection is unavailable.');
   const {data,error}=await window.ZAH_DB.client.auth.getSession();
   if(error) throw error;
   el.className='ok';
   el.textContent='Your account connection is working. You can continue learning.';
 }catch(e){
   el.className='bad';
   el.textContent='We couldn’t connect to your account right now. Please refresh and try again.';
 }
},{once:true});
</script>
<script defer="" src="assets/scripts/modern.js"></script><script defer="" src="assets/scripts/course-studio-data.js"></script><script defer="" src="assets/scripts/learner-companion.js"></script><script defer="" src="assets/scripts/responsive.js"></script>
<script defer src="assets/scripts/accessibility.js"></script><script defer src="assets/scripts/embedded-palette-sync.js"></script><script defer src="assets/scripts/learning-experience.js"></script><script defer src="assets/scripts/experience.js"></script>
</body>
