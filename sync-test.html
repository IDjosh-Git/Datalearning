<body data-responsive-page="sync-test">
<div class="card">
<h1>Check saved learning progress</h1>
<p>See whether your Excel, SQL and Power BI learning progress is up to date. If anything needs attention, you can try saving again.</p>
<div class="row wait" id="user">Checking learner account…</div>
<div class="row wait" id="excel">Excel: waiting…</div>
<div class="row wait" id="sql">SQL: waiting…</div>
<div class="row wait" id="powerbi">Power BI: waiting…</div>
<button id="retry">Update My Progress</button>
<a href="account.html">My Account</a>
<a href="index.html">Learning Portal</a>
</div>
<script src="assets/progress-cloud.js?v=20261021.3"></script>
<script>
async function run(){
 const userEl=document.getElementById('user');
 const user=await window.ZAHProgressCloud.getUser();
 if(!user){
   userEl.className='row bad';userEl.textContent='Not signed in. Sign in first.';
   return;
 }
 userEl.className='row ok';userEl.textContent='Signed in as: '+user.email;
 const result=await window.ZAHProgressCloud.syncAll();
 for(const slug of ['excel','sql','powerbi']){
   const el=document.getElementById(slug),r=result.courses[slug];
   if(r?.ok){
     el.className='row ok';
     el.textContent=`${slug.toUpperCase()}: ${r.completed}/10 weeks • ${r.percent}% • saved ${new Date(r.lastSync).toLocaleString()}`;
   }else{
     el.className='row bad';
     el.textContent=`${slug.toUpperCase()}: we couldn’t update your progress. Please try again.`;
   }
 }
}
document.getElementById('retry').onclick=run;
run();
</script>
